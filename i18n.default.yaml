# Slash command / UI strings (ja + en).
# Discord default description = Japanese; en-US/en-GB via Translator.
# Runtime replies use interaction.locale (ja* → ja, else en).

commands:
  shitpost:
    description:
      ja: "URL を fixlink して投稿し、送受信メッシュへ転送する"
      en: "Fixlink a URL, post it here, and forward to your mesh"
    options:
      url:
        ja: "X / pixiv / Instagram などの投稿 URL"
        en: "Post URL (X / Twitter, pixiv, Instagram, …)"
      silent:
        ja: "通知なしで投稿するか（省略時は false＝通常通知）"
        en: "Post without push notifications (default false = normal)"

  shitposting_router:
    description:
      ja: "単方向の転送ルートを追加する（サーバー→チャンネル選択）"
      en: "Add a one-way forward route (pick server → channel)"
    options:
      count:
        ja: "追加する転送先の数（省略時 1）"
        en: "Number of destinations to add (default 1)"

  shitposting_router_mesh:
    description:
      ja: "選んだチャンネル同士を双方向の送受信メッシュでつなぐ"
      en: "Connect chosen channels into a bidirectional send/receive mesh"
    options:
      count:
        ja: "メッシュに含めるチャンネル数（2 以上）"
        en: "How many channels to include in the mesh (2+)"

  shitposting_router_mesh_add:
    description:
      ja: "既存の送受信メッシュにチャンネルを追加する"
      en: "Add channels to an existing send/receive mesh"
    options:
      count:
        ja: "追加するチャンネル数（省略時 1）"
        en: "How many channels to add (default 1)"

  shitposting_router_remove:
    description:
      ja: "送受信メッシュの転送先を 1 件だけ解除する"
      en: "Remove one mesh destination from this channel"
    options:
      channel_id:
        ja: "解除する転送先チャンネル ID"
        en: "Destination channel ID to remove"

  shitposting_router_remove_all:
    description:
      ja: "送受信メッシュを一括削除する"
      en: "Delete send/receive mesh routes in bulk"
    options:
      scope:
        ja: "削除する範囲"
        en: "What to delete"

  show_settings:
    description:
      ja: "このサーバーでの自分の送受信メッシュを表示する"
      en: "Show your send/receive mesh for this server"

  show_settings_admin:
    description:
      ja: "【管理者】このサーバーの全ユーザーの送受信メッシュを表示する"
      en: "[Admin] Show every user's send/receive mesh on this server"

  reload_config:
    description:
      ja: "config / i18n / routes を再読み込みする"
      en: "Reload config, i18n, and routes"

  help:
    description:
      ja: "コマンド一覧と使い方を表示する"
      en: "Show commands and how to use them"

choices:
  remove_all_scope:
    source:
      ja: "このチャンネルからの送信メッシュを全削除"
      en: "Delete all outbound mesh routes from this channel"
    purge:
      ja: "このチャンネルを送受信メッシュから除外"
      en: "Remove this channel from the mesh (send + receive)"
    all:
      ja: "すべての送受信メッシュを削除"
      en: "Delete all send/receive mesh routes"

help:
  title:
    ja: "## ShitPostGateWayBOT"
    en: "## ShitPostGateWayBOT"
  intro:
    ja: "複数の界隈にいるのに、同じ投稿をサーバーごと貼るのが面倒な人向けのゲートウェイです。"
    en: "A gateway for people in multiple communities who are tired of pasting the same post into every server."
  commands_heading:
    ja: "### コマンド一覧"
    en: "### Commands"
  tips_heading:
    ja: "### 補足"
    en: "### Notes"
  tips_body:
    ja: |
      - fixlink 対応: X / Twitter・pixiv・Instagram
      - NSFW チャンネルからの転送先は NSFW のみ（ルート／メッシュ候補も NSFW に限定）
      - ルート設定のサーバー一覧は、あなたと Bot の共通サーバーのみ
      - 投稿には `-# ShitPostGateWayBot From [name](プロフィールURL)` が付きます（メンション通知なし）
      - `/shitpost` の `silent` で通知なしにできます（省略時は通常通知）
      - 表示言語は Discord のユーザー言語（日本語以外は英語）
    en: |
      - Fixlink: X / Twitter, pixiv, Instagram
      - NSFW sources only forward to NSFW destinations (route/mesh pickers also filter to NSFW)
      - Route pickers only list servers you and the bot both share
      - Posts are prefixed with `-# ShitPostGateWayBot From [name](profile URL)` (no mention ping)
      - `/shitpost` `silent:true` disables push notifications (default: normal)
      - UI language follows your Discord locale (Japanese → ja, otherwise en)
  blocks:
    shitpost:
      ja: |
        **`/shitpost`**
        URL を fixlink してこのチャンネルに投稿し、送受信メッシュ先へ同時転送します。
        -# `silent` で通知なし（省略時 false＝通常通知）。応答件数は実行者のみ
      en: |
        **`/shitpost`**
        Fixlink a URL, post it here, and fan it out to your mesh.
        -# `silent:true` for no push notifications (default false). Count reply is only for you
    shitposting_router:
      ja: |
        **`/shitposting_router`**
        単方向ルートを追加します。サーバー → チャンネルをプルダウンで選択。
        -# `count` で転送先の数を指定（省略時 1）
      en: |
        **`/shitposting_router`**
        Add a one-way route. Pick server → channel from dropdowns.
        -# `count` sets how many destinations (default 1)
    shitposting_router_mesh:
      ja: |
        **`/shitposting_router_mesh`**
        選んだチャンネル同士を双方向の送受信メッシュで一括接続します。
        -# `count` はメッシュに含めるチャンネル数（2 以上）
      en: |
        **`/shitposting_router_mesh`**
        Wire chosen channels into a bidirectional send/receive mesh.
        -# `count` is how many channels to include (2+)
    shitposting_router_mesh_add:
      ja: |
        **`/shitposting_router_mesh_add`**
        既存の送受信メッシュにチャンネルを追加します（メッシュ内チャンネルで実行）。
        -# `count` は追加するチャンネル数
      en: |
        **`/shitposting_router_mesh_add`**
        Add channels to an existing mesh (run inside a mesh member channel).
        -# `count` is how many channels to add
    shitposting_router_remove:
      ja: |
        **`/shitposting_router_remove`**
        送受信メッシュの転送先を、チャンネル ID 指定で 1 件解除します。
      en: |
        **`/shitposting_router_remove`**
        Remove one mesh destination by channel ID.
    shitposting_router_remove_all:
      ja: |
        **`/shitposting_router_remove_all`**
        送受信メッシュ一括削除（このチャンネルの送信 / 完全除外 / すべて削除）。
      en: |
        **`/shitposting_router_remove_all`**
        Bulk-delete mesh routes (outbound from here / purge channel / delete all).
    show_settings:
      ja: |
        **`/show_settings`**
        このサーバーにおける自分の送受信メッシュ一覧を表示します（他人の設定は見えません）。
      en: |
        **`/show_settings`**
        Show your send/receive mesh on this server (other users' routes stay hidden).
    show_settings_admin:
      ja: |
        **`/show_settings_admin`**
        【オーナー / Administrator】全ユーザーの送受信メッシュを Components V2 で表示（ページングあり）。
      en: |
        **`/show_settings_admin`**
        [Owner / Administrator] Show every user's mesh via Components V2 (paginated).
    reload_config:
      ja: |
        **`/reload_config`**
        `config.yaml`・`i18n.yaml`・`routes.json` を再読み込みします。
      en: |
        **`/reload_config`**
        Reload `config.yaml`, `i18n.yaml`, and `routes.json`.
    help:
      ja: |
        **`/help`**
        このヘルプを表示します。
      en: |
        **`/help`**
        Show this help.

